name: Publish Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  STORYBOOK_URL: https://wil-gerard.github.io/mapsgl-storybook-testing/
  XWEATHER_PROXY_URL: https://mapsgl-proxy.williamrgerard.workers.dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Only the proxy URL and the URL restricted Mapbox token enter the public build.
      - run: npm run build-storybook
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.PAGES_MAPBOX_ACCESS_TOKEN }}
      - name: Check the build for private credentials
        shell: bash
        env:
          XWEATHER_CLIENT_ID: ${{ secrets.XWEATHER_CLIENT_ID }}
          XWEATHER_CLIENT_SECRET: ${{ secrets.XWEATHER_CLIENT_SECRET }}
          PRIVATE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          for name in XWEATHER_CLIENT_ID XWEATHER_CLIENT_SECRET PRIVATE_MAPBOX_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Set the secret behind $name so the build can be checked for it."
              exit 1
            fi
            if grep -rqF "${!name}" storybook-static; then
              echo "::error::$name was found in the Storybook build."
              exit 1
            fi
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  live-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The published page only works from its own origin, so test it there.
      - run: npm run test:maps -- --url "$STORYBOOK_URL"
