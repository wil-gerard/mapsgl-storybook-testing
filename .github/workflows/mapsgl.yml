name: MapsGL Storybook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build-storybook

  live-smoke:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      XWEATHER_CLIENT_ID: ${{ secrets.XWEATHER_CLIENT_ID }}
      XWEATHER_CLIENT_SECRET: ${{ secrets.XWEATHER_CLIENT_SECRET }}
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Check live service configuration
        shell: bash
        run: |
          for credential in XWEATHER_CLIENT_ID XWEATHER_CLIENT_SECRET MAPBOX_ACCESS_TOKEN; do
            if [ -z "${!credential}" ]; then
              echo "::error::Set the $credential repository secret to run MapsGL smoke tests."
              exit 1
            fi
          done
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - name: Test built Storybook
        shell: bash
        run: |
          python3 -m http.server 6006 --bind 127.0.0.1 --directory storybook-static > /tmp/mapsgl-storybook-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:6006/index.json > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo '::error::Built Storybook server did not become ready.'
            exit 1
          fi
          npm run test:maps -- --url http://127.0.0.1:6006
